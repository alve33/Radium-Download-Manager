name: Bug Report
description: Report a defect in Radium Download Manager or the browser extension.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the details below so we can reproduce and fix it.
  - type: input
    id: version
    attributes:
      label: Radium Version
      description: e.g. v1.0.0 (x64 Installer / Portable / ARM64)
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows Version
      description: e.g. Windows 11 24H2 x64, Windows 10 22H2
      placeholder: Windows 11 24H2 x64
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Open Radium...
        2. Add download URL...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or Screenshots
      description: Paste any relevant log output (please redact personal paths, cookies, or auth tokens).
