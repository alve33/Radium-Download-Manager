# SPDX-License-Identifier: Apache-2.0
# Radium Download Manager -- GitLab CI/CD Pipeline Configuration
# Fully automated production release pipeline for Radium Download Manager
# Handles x64 and ARM64 builds, packaging, testing, verification, and GitLab Releases.

stages:
  - validate
  - build
  - test
  - package
  - publish

variables:
  GIT_DEPTH: "20"
  RADIUM_AUTHORITATIVE_VERSION: "1.0.0"
  GLAB_ENABLE_CI_AUTOLOGIN: "true"

default:
  interruptible: true

# =============================================================================
# STAGE: validate
# =============================================================================
validate:versions-and-config:
  stage: validate
  image: python:3.12-slim
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+.*$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - python -m pip install --upgrade pip
  script:
    - python scripts/generate_config.py
    - python scripts/validate_readmes.py
    - python -c "ver = open('VERSION').read().strip(); print('Validated canonical repository version:', ver)"

validate:browser-extension:
  stage: validate
  image: node:20-slim
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+.*$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - node tests/test_extension_detection.js

# =============================================================================
# STAGE: build
# =============================================================================
build:windows-x64:
  stage: build
  tags:
    - saas-windows-medium-amd64
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+.*$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    ErrorActionPreference: "Stop"
  script:
    - |
      # 1. Reliable Visual Studio / MSVC Detection
      $vsInst = $null
      $vswherePaths = @(
        "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe",
        "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe"
      )
      $vsWhere = $vswherePaths | Where-Object { Test-Path $_ } | Select-Object -First 1

      if ($vsWhere) {
        Write-Host "Running vswhere from: $vsWhere"
        $candidates = & $vsWhere -latest -products "*" -property installationPath
        if ($candidates) {
          $firstCandidate = ($candidates -split "`r?`n")[0].Trim()
          if ($firstCandidate -and (Test-Path $firstCandidate)) {
            $vsInst = $firstCandidate
          }
        }
      }

      if (-not $vsInst) {
        $wellKnownVsPaths = @(
          "C:\Program Files\Microsoft Visual Studio\18\Community",
          "C:\Program Files\Microsoft Visual Studio\18\Enterprise",
          "C:\Program Files\Microsoft Visual Studio\18\Professional",
          "C:\Program Files\Microsoft Visual Studio\2022\Community",
          "C:\Program Files\Microsoft Visual Studio\2022\Enterprise",
          "C:\Program Files\Microsoft Visual Studio\2022\Professional",
          "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools",
          "C:\Program Files (x86)\Microsoft Visual Studio\2019\BuildTools",
          "C:\Program Files (x86)\Microsoft Visual Studio\2019\Enterprise"
        )
        foreach ($wp in $wellKnownVsPaths) {
          if (Test-Path $wp) {
            $vsInst = $wp
            break
          }
        }
      }

      if (-not $vsInst) {
        throw "Visual Studio installation not found via vswhere or standard search paths."
      }

      Write-Host "Detected Visual Studio installation: $vsInst"
      $vcvars64 = Join-Path $vsInst "VC\Auxiliary\Build\vcvars64.bat"
      if (-not (Test-Path $vcvars64)) {
        throw "vcvars64.bat not found at expected path: $vcvars64"
      }

      # 2. Configure and Build x64 Targets
      cmd.exe /c "call `"$vcvars64`" && cmake -B build/win-x64 -A x64 -DCMAKE_BUILD_TYPE=Release && cmake --build build/win-x64 --config Release --target radium radium-nmh radium_unit_tests radium_core_tests N_m3u8DL-RE"
      if ($LASTEXITCODE -ne 0) { throw "CMake build failed for Windows x64 with exit code $LASTEXITCODE" }

      # 3. Provision Stream Workers
      powershell -ExecutionPolicy Bypass -File scripts/fetch-workers.ps1 -TargetDir tools/win-x64 -Architecture x64
  artifacts:
    name: radium-binaries-x64-$CI_COMMIT_REF_SLUG
    expire_in: 1 day
    paths:
      - build/win-x64/Release/
      - tools/win-x64/

build:windows-arm64:
  stage: build
  tags:
    - saas-windows-medium-amd64
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+.*$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    ErrorActionPreference: "Stop"
  script:
    - |
      # 1. Reliable Visual Studio / MSVC Detection
      $vsInst = $null
      $vswherePaths = @(
        "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe",
        "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe"
      )
      $vsWhere = $vswherePaths | Where-Object { Test-Path $_ } | Select-Object -First 1

      if ($vsWhere) {
        Write-Host "Running vswhere from: $vsWhere"
        $candidates = & $vsWhere -latest -products "*" -property installationPath
        if ($candidates) {
          $firstCandidate = ($candidates -split "`r?`n")[0].Trim()
          if ($firstCandidate -and (Test-Path $firstCandidate)) {
            $vsInst = $firstCandidate
          }
        }
      }

      if (-not $vsInst) {
        $wellKnownVsPaths = @(
          "C:\Program Files\Microsoft Visual Studio\18\Community",
          "C:\Program Files\Microsoft Visual Studio\18\Enterprise",
          "C:\Program Files\Microsoft Visual Studio\18\Professional",
          "C:\Program Files\Microsoft Visual Studio\2022\Community",
          "C:\Program Files\Microsoft Visual Studio\2022\Enterprise",
          "C:\Program Files\Microsoft Visual Studio\2022\Professional",
          "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools",
          "C:\Program Files (x86)\Microsoft Visual Studio\2019\BuildTools",
          "C:\Program Files (x86)\Microsoft Visual Studio\2019\Enterprise"
        )
        foreach ($wp in $wellKnownVsPaths) {
          if (Test-Path $wp) {
            $vsInst = $wp
            break
          }
        }
      }

      if (-not $vsInst) {
        throw "Visual Studio installation not found via vswhere or standard search paths."
      }

      Write-Host "Detected Visual Studio installation: $vsInst"
      $vcvars_cross = Join-Path $vsInst "VC\Auxiliary\Build\vcvarsamd64_arm64.bat"
      if (-not (Test-Path $vcvars_cross)) {
        throw "ARM64 cross-compiler batch file not found: $vcvars_cross"
      }

      # 2. Configure and Cross-Compile ARM64 Targets
      cmd.exe /c "call `"$vcvars_cross`" && cmake -B build/win-arm64 -A ARM64 -DCMAKE_BUILD_TYPE=Release && cmake --build build/win-arm64 --config Release --target radium radium-nmh radium_unit_tests radium_core_tests N_m3u8DL-RE"
      if ($LASTEXITCODE -ne 0) { throw "CMake build failed for Windows ARM64 with exit code $LASTEXITCODE" }

      # 3. Provision Architecture-Specific Stream Workers
      powershell -ExecutionPolicy Bypass -File scripts/fetch-workers.ps1 -TargetDir tools/win-arm64 -Architecture ARM64
  artifacts:
    name: radium-binaries-arm64-$CI_COMMIT_REF_SLUG
    expire_in: 1 day
    paths:
      - build/win-arm64/Release/
      - tools/win-arm64/

# =============================================================================
# STAGE: test
# =============================================================================
test:unit-tests-x64:
  stage: test
  tags:
    - saas-windows-medium-amd64
  needs:
    - job: build:windows-x64
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+.*$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - .\build\win-x64\Release\radium_unit_tests.exe
    - .\build\win-x64\Release\radium_core_tests.exe

test:verify-architectures:
  stage: test
  tags:
    - saas-windows-medium-amd64
  needs:
    - job: build:windows-x64
      artifacts: true
    - job: build:windows-arm64
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+.*$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - |
      function Verify-PeMachine([string]$path, [uint16]$expectedMachine, [string]$archName) {
        if (-not (Test-Path $path)) { throw "Missing expected binary: $path" }
        $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $path).Path)
        $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
        $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
        if ($machine -ne $expectedMachine) {
          throw "Architecture mismatch for $path: Expected $archName (0x$($expectedMachine.ToString('X4'))), got 0x$($machine.ToString('X4'))"
        }
        Write-Host "Verified $archName PE header: $path" -ForegroundColor Green
      }

      # 0x8664 = AMD64
      Verify-PeMachine "build/win-x64/Release/radium.exe" 0x8664 "AMD64"
      Verify-PeMachine "build/win-x64/Release/radium-nmh.exe" 0x8664 "AMD64"
      Verify-PeMachine "build/win-x64/Release/radium_unit_tests.exe" 0x8664 "AMD64"

      # 0xAA64 = ARM64
      Verify-PeMachine "build/win-arm64/Release/radium.exe" 0xAA64 "ARM64"
      Verify-PeMachine "build/win-arm64/Release/radium-nmh.exe" 0xAA64 "ARM64"
      Verify-PeMachine "build/win-arm64/Release/radium_unit_tests.exe" 0xAA64 "ARM64"

# =============================================================================
# STAGE: package
# =============================================================================
package:windows-distributions:
  stage: package
  tags:
    - saas-windows-medium-amd64
  needs:
    - job: build:windows-x64
      artifacts: true
    - job: build:windows-arm64
      artifacts: true
    - job: test:verify-architectures
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+.*$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    ErrorActionPreference: "Stop"
  script:
    - |
      # Resolve authoritative version
      $ver = (Get-Content VERSION -Raw).Trim()
      Write-Host "Packaging release distributions for version: $ver"
      New-Item -ItemType Directory -Force -Path dist | Out-Null

      # Ensure Inno Setup 6 compiler is available
      $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
      if (-not (Test-Path $iscc)) {
        Write-Host "Installing Inno Setup via Chocolatey..."
        choco install innosetup -y
      }

      # 1. Package Windows x64 Portable Archives
      powershell -ExecutionPolicy Bypass -File scripts/package-release-zip.ps1 -Version "$ver" -Architecture x64 -PackageType Both -BuildDir "build/win-x64/Release"

      # 2. Package Windows x64 Inno Setup Installers
      powershell -ExecutionPolicy Bypass -File scripts/build-installer.ps1 -Version "$ver" -Architecture x64 -Type Both -BuildDir "build/win-x64/Release"

      # 3. Package Windows ARM64 Portable Archives
      powershell -ExecutionPolicy Bypass -File scripts/package-release-zip.ps1 -Version "$ver" -Architecture ARM64 -PackageType Both -BuildDir "build/win-arm64/Release"

      # 4. Package Windows ARM64 Inno Setup Installers
      powershell -ExecutionPolicy Bypass -File scripts/build-installer.ps1 -Version "$ver" -Architecture ARM64 -Type Both -BuildDir "build/win-arm64/Release"

      # 5. Build MSIX Packages if tooling is present
      try {
        powershell -ExecutionPolicy Bypass -File installer/msix/build-msix.ps1 -Architecture x64 -OutputDir dist
        powershell -ExecutionPolicy Bypass -File installer/msix/build-msix.ps1 -Architecture ARM64 -OutputDir dist
      } catch {
        Write-Host "MSIX packaging skipped or completed with notice: $_"
      }

      # 6. Generate Consolidated Canonical SHA256SUMS.txt
      $distFiles = Get-ChildItem -Path dist -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" }
      $entries = @()
      foreach ($f in $distFiles) {
        $hash = (Get-FileHash -Path $f.FullName -Algorithm SHA256).Hash
        $entries += "$hash  dist\$($f.Name)"
        Write-Host "  $hash  $($f.Name)"
      }
      $entries | Out-File -FilePath "dist/SHA256SUMS.txt" -Encoding utf8

      # 7. Verify all mandatory canonical packages are present
      $requiredReleaseFiles = @(
        "Radium-Download-Manager-v$ver-Windows-x64-Setup.exe",
        "Radium-Download-Manager-v$ver-Windows-x64-Portable.zip",
        "Radium-Download-Manager-v$ver-Windows-arm64-Setup.exe",
        "Radium-Download-Manager-v$ver-Windows-arm64-Portable.zip",
        "SHA256SUMS.txt"
      )
      foreach ($rf in $requiredReleaseFiles) {
        $found = Join-Path "dist" $rf
        if (-not (Test-Path $found)) {
          throw "Mandatory release package missing: $rf"
        }
        Write-Host "Confirmed release package: $rf ($((Get-Item $found).Length) bytes)" -ForegroundColor Green
      }
  artifacts:
    name: radium-release-dist-$CI_COMMIT_REF_SLUG
    expire_in: 7 days
    paths:
      - dist/

# =============================================================================
# STAGE: publish
# =============================================================================
publish:gitlab-release:
  stage: publish
  image: registry.gitlab.com/gitlab-org/cli:latest
  tags:
    - saas-linux-small-amd64
  needs:
    - job: package:windows-distributions
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+.*$/'
  variables:
    GIT_STRATEGY: clone
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      TAG_NAME="$CI_COMMIT_TAG"
      VER="${TAG_NAME#v}"
      echo "Publishing official GitLab Release for $TAG_NAME (Version: $VER)..."

      # 1. Upload release packages to GitLab Generic Package Registry
      PACKAGE_NAME="radium-release"
      PACKAGE_VERSION="$VER"
      PACKAGE_REGISTRY_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${PACKAGE_VERSION}"

      ASSET_LINKS='[]'

      for FILE_PATH in dist/*; do
        if [ -f "$FILE_PATH" ]; then
          FILE_NAME=$(basename "$FILE_PATH")
          echo "Uploading $FILE_NAME to Generic Package Registry..."
          
          curl --fail-with-body --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
               --upload-file "$FILE_PATH" \
               "${PACKAGE_REGISTRY_URL}/${FILE_NAME}"
          
          DIRECT_URL="${PACKAGE_REGISTRY_URL}/${FILE_NAME}"
          LINK_TYPE="package"
          if [[ "$FILE_NAME" == *"SHA256"* ]] || [[ "$FILE_NAME" == *".txt"* ]]; then
            LINK_TYPE="other"
          fi
          
          ASSET_LINKS=$(echo "$ASSET_LINKS" | jq --arg name "$FILE_NAME" --arg url "$DIRECT_URL" --arg type "$LINK_TYPE" \
            '. += [{"name": $name, "url": $url, "link_type": $type}]')
        fi
      done

      # 2. Extract or generate meaningful release notes
      cat << 'EOF' > release_notes.md
      # Radium Download Manager v1.0.0

      Official production release of **Radium Download Manager (RDM)**, a high-performance Windows 11 open-source download manager and browser media downloader.

      ## Primary Release Downloads

      | Architecture | Package Type | Filename |
      | :--- | :--- | :--- |
      | **Windows x64** | Full Installer | `Radium-Download-Manager-v1.0.0-Windows-x64-Setup.exe` |
      | **Windows x64** | Portable ZIP | `Radium-Download-Manager-v1.0.0-Windows-x64-Portable.zip` |
      | **Windows ARM64** | Native Installer | `Radium-Download-Manager-v1.0.0-Windows-arm64-Setup.exe` |
      | **Windows ARM64** | Portable ZIP | `Radium-Download-Manager-v1.0.0-Windows-arm64-Portable.zip` |
      | **Checksums** | SHA-256 Hashes | `SHA256SUMS.txt` |

      ## Key Highlights & Architectural Features

      - **High-Performance HTTP/HTTPS Segmented Engine:** Native C++20 / WinHTTP engine with dynamic connection spawning and work-stealing range reuse.
      - **Native Windows 11 Shell Integration:** Fully responsive Win32 desktop interface with system tray minimize, toast notifications, and dark/light system theme synchronization.
      - **Manifest V3 Browser Extensions:** Zero-leakage Chromium & Firefox extensions with real-time media sniffing, video overlay controls, and automatic categorization.
      - **Stream Extraction Pipeline:** Built-in HLS/DASH/MSS probing, segment fetching, and muxing via sandboxed native workers.
      - **Dual-Architecture Support:** Verified native builds for both AMD64 (x64) and native ARM64 (0xAA64) Windows 11 devices.
      - **Zero-Footprint Portable Mode:** True standalone portability with automatic local `./data` configuration redirection.
      - **Open Source Licensing:** Complete codebase licensed under Apache License 2.0.

      ## Portable Edition Instructions
      1. Download and extract `Radium-Download-Manager-v1.0.0-Windows-<arch>-Portable.zip`.
      2. Run `radium.exe`. All application state, task history, and settings are stored locally in `./data`.
      3. No administrative privileges or registry writes are required.

      ## Verification
      Verify the integrity of downloaded assets using SHA-256:
      ```powershell
      Get-FileHash -Algorithm SHA256 <Downloaded-File>
      ```
      Compare the computed hash against the values listed in `SHA256SUMS.txt`.
      EOF

      # 3. Create or update GitLab Release with asset links
      echo "Asset Links JSON:"
      echo "$ASSET_LINKS" | jq .

      echo "Creating GitLab Release..."
      glab release create "$TAG_NAME" \
        --name "Radium Download Manager $TAG_NAME" \
        --notes-file release_notes.md \
        --assets-links "$ASSET_LINKS"
      
      echo "GitLab Release for $TAG_NAME published successfully!"
